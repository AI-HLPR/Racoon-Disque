<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raccoon Disque: Story Mode</title>
<style>
:root{
  /* layout: one 3D stage card, title and teams underneath, controls last; single dark "match night" theme */
  --night:#0b1224;
  --panel:#141d38;
  --ink:#f3efe6;
  --muted:#9aa6c4;
  --blue:#2f63ee;
  --orange:#f26a21;
  --gold:#ffd23f;
  --font-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--font-body);min-height:100%}
main{max-width:960px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
.stage{position:relative;aspect-ratio:16/10;background:#16213f;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (max-width:560px){.stage{aspect-ratio:4/5}}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:0;background:rgba(8,12,28,.72);border-radius:12px;overflow:hidden;pointer-events:none;font-family:var(--font-display)}
.hud .team{padding:7px 12px;font-weight:700;font-size:12px;letter-spacing:.1em}
.hud .team.a{background:var(--blue)}
.hud .team.b{background:var(--orange)}
.hud .num{padding:4px 12px;font-weight:800;font-size:26px;min-width:44px;text-align:center}
.hud .clock{padding:4px 10px;font-size:13px;color:#cfd8f5;font-weight:700;letter-spacing:.05em;min-width:58px;text-align:center;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}
@media (max-width:560px){.hud .team{padding:6px 7px;font-size:10px}.hud .num{font-size:22px;padding:4px 8px}.hud .clock{padding:4px 6px}}
.goal{position:absolute;left:50%;top:16%;transform:translate(-50%,0) scale(.2);opacity:0;font:800 clamp(44px,11vw,96px)/1 var(--font-display);color:var(--gold);-webkit-text-stroke:6px #0b1224;paint-order:stroke fill;pointer-events:none;text-align:center;white-space:nowrap}
.goal small{display:block;font-size:.3em;letter-spacing:.12em;-webkit-text-stroke:3px #0b1224}
.goal.show{animation:pop 3s ease both}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,0) scale(.2)}
  10%{opacity:1;transform:translate(-50%,0) scale(1.25)}
  16%{transform:translate(-50%,0) scale(1)}
  80%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,0) scale(1)}
}
.pill{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,12,28,.78);border-radius:999px;padding:7px 14px;font:700 13px var(--font-display);letter-spacing:.06em;white-space:nowrap;pointer-events:none;display:none}
.cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,12,28,.88);border-radius:14px;padding:12px 14px;display:none}
.cap p{margin:0 0 10px;font-size:16px;line-height:1.4}
.cap .btns{display:flex;gap:8px;flex-wrap:wrap}
.cap .btns:empty{display:none}
.cap button{font-size:16px;padding:10px 18px;touch-action:manipulation}
.cap button.primary{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
.cap button.ans{min-width:64px;font:700 20px var(--font-display)}
.cap button:disabled{opacity:.45}
.swim{position:absolute;inset:0;pointer-events:none;display:none}
.sinfo{position:absolute;left:12px;right:12px;top:48px;text-align:center;font:700 15px var(--font-display);text-shadow:0 1px 3px rgba(0,0,0,.7)}
#swimInfo{display:inline-block;background:rgba(8,12,28,.78);border-radius:999px;padding:5px 12px}
.track{height:10px;border-radius:6px;background:rgba(8,12,28,.6);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--blue)}
.track.t2{margin-top:4px;display:none}
.track.t2 i{background:var(--orange)}
.meter{position:absolute;left:12%;right:12%;bottom:128px;height:26px;border-radius:13px;background:rgba(8,12,28,.75);display:none}
.meter .zone{position:absolute;top:0;bottom:0;background:#37c36b;border-radius:6px}
.meter .mark{position:absolute;top:-5px;width:10px;height:36px;margin-left:-5px;border-radius:5px;background:#fff;box-shadow:0 0 0 2px #0b1224}
.pad{position:absolute;bottom:16px;width:96px;height:96px;border-radius:50%;pointer-events:auto;font:800 16px var(--font-display);background:rgba(47,99,238,.92);border:3px solid #fff;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:none}
.pad:active{transform:scale(.94)}
.pad.l{left:16px}.pad.r{right:16px;background:rgba(242,106,33,.94)}
.pad.c{left:50%;margin-left:-48px;background:rgba(255,210,63,.96);color:#1a1300}
.boss,.ctrl{position:absolute;inset:0;pointer-events:none;display:none;font-family:var(--font-display)}
.bhead{position:absolute;left:12px;right:12px;top:46px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;letter-spacing:.06em;text-shadow:0 1px 3px #000}
.bhead span{color:#ff5a6a;font-size:22px;letter-spacing:2px}
.track.bt{position:absolute;left:12px;right:12px;top:74px;height:16px;border-radius:8px;border:2px solid #fff;background:rgba(8,12,28,.7)}
.track.bt i{background:linear-gradient(90deg,#ff2a2a,#ff8a3c);transition:width .15s}
#bossInfo:empty{display:none}
#bossInfo{position:absolute;left:50%;bottom:196px;transform:translateX(-50%);background:rgba(8,12,28,.78);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.dpad{position:absolute;left:12px;bottom:12px;width:174px;height:174px;pointer-events:none}
.dpad button{position:absolute;width:58px;height:58px;border-radius:14px;padding:0;font-size:22px;pointer-events:auto;background:rgba(20,29,56,.88);border:2px solid #fff;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button:active{background:var(--blue)}
#dU{left:58px;top:0}#dL{left:0;top:58px}#dR{left:116px;top:58px}#dD{left:58px;top:116px}
.dpad button.dg{width:48px;height:48px;font-size:15px;border-radius:12px;background:rgba(20,29,56,.7);color:rgba(255,255,255,.85)}#dUL{left:4px;top:4px}#dUR{left:122px;top:4px}#dDL{left:4px;top:122px}#dDR{left:122px;top:122px}
.pad.kick{display:block;right:16px;bottom:40px;width:104px;height:104px;background:rgba(90,90,110,.8);font-size:20px;touch-action:none}
.pad.kick.ready{background:var(--gold);color:#1a1300;box-shadow:0 0 0 6px rgba(255,210,63,.35)}
.ctrl.run #dU,.ctrl.run #dD,.ctrl.run .dg{display:none}
.ctrl.lr #dU,.ctrl.lr #dD{visibility:hidden}
.ctrl.keeper.compact #dL,.ctrl.keeper.compact #dR{width:64px;height:64px;font-size:26px}.ctrl.keeper.compact #dL{left:0;top:34px}.ctrl.keeper.compact #dR{left:72px;top:34px}
.touchHalf{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;display:none;touch-action:none;user-select:none;-webkit-user-select:none}.ctrl.keeper .touchHalf{display:block;pointer-events:auto}#thL{left:0}#thR{right:0}.ctrl.compact .dg{display:none}.ctrl.compact .dpad{width:132px;height:132px}.ctrl.compact .dpad button{width:44px;height:44px;font-size:17px}.ctrl.compact #dU{left:44px;top:0}.ctrl.compact #dL{left:0;top:44px}.ctrl.compact #dR{left:88px;top:44px}.ctrl.compact #dD{left:44px;top:88px}
.ctrl.run .dpad{height:116px}
.dip{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,28,.6);padding:16px}
.sheet{background:#fffaf0;color:#1b2440;border:6px double #c9a227;border-radius:10px;padding:20px 22px;text-align:center;max-width:340px;width:100%}
.sheet span{font:700 13px var(--font-display);letter-spacing:.2em;color:#a07f12}
.sheet h2{font:800 34px/1.1 var(--font-display);margin:6px 0}
.sheet h3{font:800 24px var(--font-display);margin:2px 0 8px;color:#1f47d1}
.sheet p{margin:4px 0;font-size:14px}
.sheet button{margin-top:12px;background:#1f47d1;color:#fff;border-color:#1f47d1;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips button{padding:8px 14px;font-size:14px}
.chips button.on{background:var(--blue);border-color:var(--blue)}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
h1{font:800 clamp(28px,7vw,44px)/1.05 var(--font-display);margin:0;text-wrap:balance}
.teams{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.tm{flex:1 1 260px;border-radius:12px;padding:12px 14px;background:var(--panel);border-left:6px solid var(--blue);font-size:15px;line-height:1.45}
.tm.b{border-left-color:var(--orange)}
.tm b{font-family:var(--font-display);letter-spacing:.06em;font-size:13px;display:block;margin-bottom:2px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:14px;margin-left:4px}
button{font:500 15px var(--font-body);color:var(--ink);background:var(--panel);border:1px solid #2b3963;border-radius:999px;padding:10px 18px;cursor:pointer}
button:hover{background:#1c2850}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<script src="three.min.js"></script>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <div class="hud" id="hud"><span class="team a">BLUE</span><span class="num" id="sA">0</span><span class="clock" id="clock">0:00</span><span class="num" id="sB">0</span><span class="team b">ORANGE</span></div>
    <div class="pill" id="pill"></div>
    <div class="goal" id="goalText">GOAL!<small id="goalBy"></small></div>
    <div class="swim" id="swimUI">
      <div class="sinfo"><div id="swimInfo"></div><div class="track"><i id="swimFill"></i></div><div class="track t2" id="rivalTrack"><i id="rivalFill"></i></div></div>
      <div class="meter" id="meter"><i class="zone" id="zone"></i><i class="mark" id="mark"></i></div>
      <button class="pad l" id="padL" type="button">LEFT</button>
      <button class="pad r" id="padR" type="button">RIGHT</button>
      <button class="pad c" id="padC" type="button">HOLD</button>
    </div>
    <div class="boss" id="bossUI">
      <div class="bhead"><span id="hearts"></span><b id="bossName">SHADOW MONSTER</b></div>
      <div class="track bt"><i id="bossFill"></i></div>
    </div>
    <div class="ctrl" id="ctrlUI"><div class="touchHalf" id="thL"></div><div class="touchHalf" id="thR"></div>
      <div id="bossInfo"></div>
      <div class="dpad"><button id="dU" type="button" aria-label="Forward">▲</button><button id="dL" type="button" aria-label="Left">◀</button><button id="dR" type="button" aria-label="Right">▶</button><button id="dD" type="button" aria-label="Back">▼</button><button id="dUL" class="dg" type="button" aria-label="Forward left">◤</button><button id="dUR" class="dg" type="button" aria-label="Forward right">◥</button><button id="dDL" class="dg" type="button" aria-label="Back left">◣</button><button id="dDR" class="dg" type="button" aria-label="Back right">◢</button></div>
      <button class="pad kick" id="kickB" type="button">KICK</button>
    </div>
    <div class="cap" id="cap"><p id="capText"></p><div class="btns" id="capBtns"></div></div>
    <div class="dip" id="dip"><div class="sheet"><span>SWIM DIPLOMA</span><h2>Level 3</h2><p>awarded to</p><h3>Raccoon Disque</h3><p id="dipNote"></p><button type="button" id="dipBtn">Continue</button></div></div>
    <div class="msg" id="msg">This 3D view needs WebGL, which this browser has turned off.</div>
  </div>

  <div>
    <h1>Raccoon Disque: Story Mode</h1>
    <div class="chips" id="chips"></div>
  </div>

  <div class="controls">
    <button id="toggle" type="button">Pause</button>
    <button id="speed" type="button">Speed 1x</button>
    <button id="replay" type="button">Restart story</button>
    <span class="hint">Tip: tap a chapter to jump to it.</span>
  </div>
</main>

<script>
(function(){
'use strict';
var stage=document.getElementById('stage');
var goalEl=document.getElementById('goalText'),goalBy=document.getElementById('goalBy');
var sAEl=document.getElementById('sA'),sBEl=document.getElementById('sB'),clockEl=document.getElementById('clock');
var msg=document.getElementById('msg');

var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){msg.style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
stage.insertBefore(renderer.domElement,stage.firstChild);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x16213f);
scene.fog=new THREE.Fog(0x16213f,45,130);
var camera=new THREE.PerspectiveCamera(45,1,0.1,220);
var V3=THREE.Vector3;

/* ---------- helpers ---------- */
function lerp(a,b,f){return a+(b-a)*f;}
function clamp(x,a,b){return Math.min(b,Math.max(a,x));}
function clamp01(x){return Math.min(1,Math.max(0,x));}
function smooth(x){x=clamp01(x);return x*x*(3-2*x);}
function wrapA(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
var vs=987654;function rndV(){vs=(vs*16807)%2147483647;return (vs-1)/2147483646;}
var ss=1;function rndS(){ss=(ss*16807)%2147483647;return (ss-1)/2147483646;}
function gauss(){var u=1-rndS(),v=rndS();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function d2(a,b){var dx=a.x-b.x,dz=a.z-b.z;return Math.sqrt(dx*dx+dz*dz);}

var bump=(function(){
  var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d');var d=g.createImageData(128,128);
  for(var i=0;i<128*128;i++){var v=90+Math.floor(rndV()*165);d.data[i*4]=v;d.data[i*4+1]=v;d.data[i*4+2]=v;d.data[i*4+3]=255;}
  g.putImageData(d,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;
})();
function mat(c,o){var m=new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:1,metalness:0,bumpMap:bump,bumpScale:0.9,sheen:1,sheenRoughness:0.5},o||{}));m.sheenColor=new THREE.Color(c).lerp(new THREE.Color(0xffffff),0.5);return m;}
function matS(c){return new THREE.MeshStandardMaterial({color:c,roughness:0.3,metalness:0});}
var sphG=new THREE.SphereGeometry(1,24,16);
function ell(p,rx,ry,rz,m,x,y,z){
  var g=new THREE.Mesh(sphG,m);g.scale.set(rx,ry,rz);g.position.set(x,y,z);
  g.castShadow=true;g.receiveShadow=true;p.add(g);return g;
}
function cap(p,r,len,m,x,y,z){
  var g=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,5,12),m);g.position.set(x,y,z);
  g.castShadow=true;g.receiveShadow=true;p.add(g);return g;
}
function grp(p,x,y,z){var g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
function smile(p,r,x,y,z){
  var t=new THREE.Mesh(new THREE.TorusGeometry(r,0.013,6,18,Math.PI),matS(0x111111));
  t.position.set(x,y,z);t.rotation.z=Math.PI;p.add(t);return t;
}
function numTex(n){
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
  g.font='800 100px Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(n,64,70);g.fillStyle='#fff';g.fillText(n,64,70);
  var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function jersey(parent,rx,ry,rz,x,y,z,team,num){
  ell(parent,rx,ry,rz,mat(team===0?0x1f47d1:0xf26a21),x,y,z);
  if(num){
    var pl=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.3),new THREE.MeshStandardMaterial({map:numTex(num),transparent:true,roughness:1}));
    pl.position.set(x,y,z+rz+0.006);parent.add(pl);
  }
}

/* two-bone limb */
function biLeg(parent,x,y,z,thigh,shin,r,m,fm){
  var hip=grp(parent,x,y,z);
  cap(hip,r,thigh*0.8,m,0,-thigh/2,0);
  var knee=grp(hip,0,-thigh,0);
  cap(knee,r*0.92,shin*0.8,m,0,-shin/2,0);
  var ank=grp(knee,0,-shin,0);
  ell(ank,r*1.25,r*0.7,r*2.0,fm,0,-r*0.35,r*0.9);
  return {hip:hip,knee:knee,ank:ank};
}
function biArm(parent,x,y,up,fo,r,m,hm){
  var sh=grp(parent,x,y,0);
  cap(sh,r,up*0.8,m,0,-up/2,0);
  var el=grp(sh,0,-up,0);
  cap(el,r*0.92,fo*0.8,m,0,-fo/2,0);
  ell(el,r*1.2,r*1.2,r*1.2,hm||m,0,-fo,0);
  return {sh:sh,el:el,side:x>0?1:-1};
}

/* spring-driven hanging chain: hangs along apparent gravity, so it swings with movement */
function Chain(parent,px,py,pz,n,segL,r0,r1,builder,o){
  o=o||{};
  var pivot=grp(parent,px,py,pz),segs=[],cur=pivot;
  for(var i=0;i<n;i++){
    var g=grp(cur,0,i?-segL:0,0);
    builder(g,i,segL,lerp(r0,r1,n>1?i/(n-1):0));
    segs.push({g:g,ax:0,az:0,vx:0,vz:0});cur=g;
  }
  return {pivot:pivot,segs:segs,K:o.K||70,C:o.C||8,gain:o.gain||0.8,biasX:o.biasX||0,biasZ:o.biasZ||0,exX:0,exZ:0,maxA:o.maxA||1.1};
}
var _q=new THREE.Quaternion(),_d=new THREE.Vector3();
function chainUpdate(c,dt,Aw){
  c.pivot.getWorldQuaternion(_q);_q.invert();
  _d.set(-Aw.x,-9.8-Aw.y,-Aw.z).applyQuaternion(_q).normalize();
  var tx=-_d.z*c.gain,tz=_d.x*c.gain,n=c.segs.length;
  for(var i=0;i<n;i++){
    var s=c.segs[i];
    var ttx=clamp((tx+c.exX)/n+c.biasX,-c.maxA,c.maxA),ttz=clamp((tz+c.exZ)/n+c.biasZ,-c.maxA,c.maxA);
    s.vx+=(-c.K*(s.ax-ttx)-c.C*s.vx)*dt;s.ax+=s.vx*dt;
    s.vz+=(-c.K*(s.az-ttz)-c.C*s.vz)*dt;s.az+=s.vz*dt;
    s.g.rotation.x=s.ax;s.g.rotation.z=s.az;
  }
}

/* ---------- characters ---------- */
function makeRaccoon(team){
  var gray=mat(0x9b938a),dgray=mat(0x857d74),cream=mat(0xf4efe6),white=mat(0xfbf9f4),brown=mat(0x4a3327),black=matS(0x0d0d0d),glint=matS(0xffffff),
      blue=mat(0x1f47d1,{sheenRoughness:0.8}),dblue=mat(0x1a3cb4),stripe=mat(0x3b2f27);
  var root=new THREE.Group(),pel=grp(root,0,0.58,0);
  /* short stubby plush legs with soft gray feet */
  var legs=[biLeg(pel,-0.24,0.04,0.02,0.27,0.25,0.175,gray,gray),biLeg(pel,0.24,0.04,0.02,0.27,0.25,0.175,gray,gray)];
  var spine=grp(pel,0,0,0);
  /* chubby body: white fluffy belly below, blue T-shirt above */
  ell(spine,0.5,0.4,0.45,gray,0,0.3,-0.04);
  ell(spine,0.46,0.36,0.4,white,0,0.26,0.1);
  ell(spine,0.53,0.37,0.48,blue,0,0.66,0);
  var hem=new THREE.Mesh(new THREE.TorusGeometry(0.47,0.045,8,28),dblue);hem.rotation.x=Math.PI/2;hem.scale.set(1.04,0.95,1);hem.position.set(0,0.42,0.01);hem.castShadow=true;spine.add(hem);
  var col=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.04,8,24),dblue);col.rotation.x=Math.PI/2;col.position.set(0,0.98,0.03);spine.add(col);
  var c=document.createElement('canvas');c.width=256;c.height=128;var g=c.getContext('2d');
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='bold 54px "Bricolage Grotesque", Arial, sans-serif';
  g.fillText('Unmask',128,38);g.fillText('the unseen',128,92);

/* ---------- ball physics ---------- */
function stepBall(dt){
  var b=ball;
  b.v.y-=GRAV*dt;
  b.p.addScaledVector(b.v,dt);
  if(b.p.y<BR){b.p.y=BR;if(b.v.y<-1.2){b.v.y=-b.v.y*0.6;}else{b.v.y=0;}}
  var onG=b.p.y<=BR+0.02&&Math.abs(b.v.y)<0.6;
  var fr=Math.exp(-(onG?1.0:0.06)*dt);b.v.x*=fr;b.v.z*=fr;
  var side=b.p.x>0?1:-1,ax=Math.abs(b.p.x);
  if(ax<=HX+0.01){
    if(b.p.z>HZ-BR){b.p.z=HZ-BR;b.v.z=-Math.abs(b.v.z)*0.65;b.v.x*=0.94;}
    if(b.p.z<-HZ+BR){b.p.z=-HZ+BR;b.v.z=Math.abs(b.v.z)*0.65;b.v.x*=0.94;}
  }
  /* posts */
  for(var s=-1;s<=1;s+=2){
    var px=side*HX,pz=s*GW;
    var dx=b.p.x-px,dz=b.p.z-pz,dd=Math.sqrt(dx*dx+dz*dz),mn=BR+0.09;
    if(dd<mn&&b.p.y<GH+0.1&&dd>1e-4){
      var nx=dx/dd,nz=dz/dd;b.p.x=px+nx*mn;b.p.z=pz+nz*mn;
      var vn=b.v.x*nx+b.v.z*nz;if(vn<0){b.v.x-=1.6*vn*nx;b.v.z-=1.6*vn*nz;}
    }
  }
  if(ax>HX-BR&&ax<=HX+0.15){
    var inMouth=Math.abs(b.p.z)<GW-0.02&&b.p.y<GH-0.1;
    if(!inMouth&&b.v.x*side>0){b.p.x=side*(HX-BR);b.v.x=-b.v.x*0.6;b.v.z*=0.92;}
  }
  if(ax>HX){
    if(ax>HX+GD-BR){b.p.x=side*(HX+GD-BR);b.v.x*=-0.15;b.v.z*=0.5;}
    if(b.p.z>GW-BR){b.p.z=GW-BR;b.v.z=-Math.abs(b.v.z)*0.3;}
    else if(b.p.z<-GW+BR){b.p.z=-GW+BR;b.v.z=Math.abs(b.v.z)*0.3;}
    if(b.p.y>GH-BR){b.p.y=GH-BR;b.v.y=-Math.abs(b.v.y)*0.2;}
  }
  if(b.p.y>6){b.p.y=6;b.v.y=-Math.abs(b.v.y)*0.4;}
}

/* ---------- AI ---------- */
function teamField(tm){return players.filter(function(q){return q.team===tm&&q.role==='field';});}
function keeperOf(tm){return players.filter(function(q){return q.team===tm&&q.role==='gk';})[0];}
function intercept(p){
  var d=d2(p.pos,ball.p),tl=clamp(d/(p.speed+3),0,0.8);
  return {x:ball.p.x+ball.v.x*tl,z:ball.p.z+ball.v.z*tl};
}
function pickChasers(){
  [0,1].forEach(function(tm){
    var best=null,be=1e9;
    teamField(tm).forEach(function(p){
      var ip=intercept(p);var eta=d2(p.pos,ip)/p.speed+(p.id===game.chaser[tm]?-0.3:0)+(p.kick?0.3:0)+(p.pro?-0.4:0);
      if(eta<be){be=eta;best=p;}
    });
    game.chaser[tm]=best.id;
  });
}
function startKick(p,tx,tz,speed,ht){p.kick={tx:tx,tz:tz,speed:speed,ht:ht,done:false};p.kickT=0;p.cool=0.9;}
function applyKick(p){
  var k=p.kick,b=ball;
  var dx=k.tx-b.p.x,dz=k.tz-b.p.z,dist=Math.max(0.5,Math.sqrt(dx*dx+dz*dz));
  var t=dist/k.speed;
  b.v.x=dx/dist*k.speed;b.v.z=dz/dist*k.speed;
  b.v.y=clamp((k.ht-b.p.y+0.5*GRAV*t*t)/t,1.2,9);
  b.p.y=Math.max(b.p.y,BR+0.05);
  game.lastTouch=p;game.lastTeam=p.team;
  if(!noRender)puff(b.p.x,b.p.z,4);
}
function moveTo(p,tx,tz,dt,maxS,arrive){
  var dx=tx-p.pos.x,dz=tz-p.pos.z,d=Math.sqrt(dx*dx+dz*dz);
  var sp=maxS*(arrive?clamp(d/1.4,0,1):1);
  var dvx=d>0.01?dx/d*sp:0,dvz=d>0.01?dz/d*sp:0;
  var ax=dvx-p.vel.x,az=dvz-p.vel.z,al=Math.sqrt(ax*ax+az*az),mx=p.accel*dt;
  if(al>mx){ax*=mx/al;az*=mx/al;}
  p.vel.x+=ax;p.vel.z+=az;
}
function manualCtl(p,dt){
  var ix=(pad.r?1:0)-(pad.l?1:0),iz=(pad.d?1:0)-(pad.u?1:0);
  if(ix||iz)moveTo(p,p.pos.x+ix*10,p.pos.z+iz*10,dt,p.speed*1.12,false);else moveTo(p,p.pos.x,p.pos.z,dt,0,false);
  if(game.kickReq){
    game.kickReq=false;
    if(d2(p.pos,ball.p)<1.7&&ball.p.y<1.2&&!p.kick&&game.state==='play'){
      var fx=Math.sin(p.yaw),fz=Math.cos(p.yaw),angG=Math.atan2(HX-p.pos.x,-p.pos.z),dg=Math.sqrt((HX-p.pos.x)*(HX-p.pos.x)+p.pos.z*p.pos.z);
      var mate=players[1],angM=Math.atan2(mate.pos.x-p.pos.x,mate.pos.z-p.pos.z),dm=d2(p.pos,mate.pos);
      if(dg<17&&Math.abs(wrapA(p.yaw-angG))<0.9){
        var kz=keeperOf(1).pos.z,sgn=kz>0?-1:1;
        startKick(p,HX,sgn*(GW-0.6)*(0.5+0.5*rndS()),18.5,0.4+rndS()*0.8);
      }else if(dm>3&&dm<12&&Math.abs(wrapA(p.yaw-angM))<0.45){
        startKick(p,mate.pos.x+mate.vel.x*0.4,mate.pos.z+mate.vel.z*0.4,8+dm*0.5,0.35);
      }else{startKick(p,clamp(ball.p.x+fx*11,-HX+1,HX-1),clamp(ball.p.z+fz*11,-HZ+1,HZ-1),14,0.5);}
      p.cool=0.5;
    }
  }
}
function aiField(p,dt){
  if(game.manual&&p.id===0){manualCtl(p,dt);return;}
  var tm=p.team,dir=tm===0?1:-1,atk=dir*HX,bp=ball.p,d=d2(p.pos,bp);
  var mates=teamField(tm),opps=teamField(1-tm),oKeep=keeperOf(1-tm);
  var tx,tz,faceT=null;
  if(game.chaser[tm]===p.id){
    var ip=intercept(p),ahead=(p.pos.x-bp.x)*dir>0.4;
    if(!ahead||d>4){
      var bgx=atk-bp.x,bgz=-bp.z,bl=Math.sqrt(bgx*bgx+bgz*bgz)||1;
      var push=d<3.5?0.9:0;
      tx=ip.x+bgx/bl*push;tz=ip.z+bgz/bl*push;
    }else{tx=bp.x-dir*1.5;tz=bp.z+(p.pos.z>=bp.z?1:-1)*1.3;}
    /* ball near a wall or corner: approach from the pitch side so we never pin ourselves outside */
    var nearWall=Math.abs(bp.z)>HZ-1.8||Math.abs(bp.x)>HX-2.2;
    if(nearWall){
      var ix=-Math.sign(bp.x)*(Math.abs(bp.x)>HX-2.2?1:0.35),iz=-Math.sign(bp.z)*(Math.abs(bp.z)>HZ-1.8?1:0.35);
      var il=Math.sqrt(ix*ix+iz*iz)||1;
      tx=clamp(bp.x+ix/il*1.1,-HX+0.9,HX-0.9);tz=clamp(bp.z+iz/il*1.1,-HZ+0.9,HZ-0.9);
    }
    /* sidestep opponents ahead */
    opps.forEach(function(o){
      var ox=o.pos.x-p.pos.x,oz=o.pos.z-p.pos.z,od=Math.sqrt(ox*ox+oz*oz);
      if(od<2.2&&ox*dir>0){tz+=(oz>0?-1:1)*1.6*(1-od/2.2);}
    });
    if(d<1.25&&p.cool<=0&&!p.kick&&game.state==='play'){
      var dg=Math.sqrt((atk-p.pos.x)*(atk-p.pos.x)+p.pos.z*p.pos.z);
      var angG=Math.atan2(atk-p.pos.x,-p.pos.z);
      var wallBall=Math.abs(bp.z)>HZ-1.8||Math.abs(bp.x)>HX-2.2;
      if(wallBall){
        startKick(p,clamp(bp.x*0.3+dir*4,-8,8),-Math.sign(bp.z)*3,10,0.4);
      }else if(bp.x*dir<-9.5){
        startKick(p,dir*3,(rndS()<0.5?-1:1)*(4+rndS()*3),11+rndS()*3,0.6);
      }else if(dg<(p.pro?15:11)&&Math.abs(wrapA(p.yaw-angG))<(p.pro?1.6:1.3)&&rndS()<(p.pro?0.7:0.25)){
        var kz=oKeep.pos.z,sgn=kz>0?-1:1;
        var zt=sgn*(GW-0.55)*(0.55+0.45*rndS())+gauss()*(1.15-p.aim)*1.1;
        startKick(p,atk,zt,(16+3*rndS())*p.power,p.pro?0.25+rndS()*0.5:0.35+rndS()*1.1);
      }else{
        var best=null;
        mates.forEach(function(m){if(m!==p){var open=true;opps.forEach(function(o){if(d2(o.pos,m.pos)<2.2)open=false;});if(open&&(m.pos.x-p.pos.x)*dir>-1.5)best=m;}});
        var pressed=false;opps.forEach(function(o){if(d2(o.pos,p.pos)<2.4)pressed=true;});
        if(best&&pressed&&rndS()<(p.pro?0.3:0.05)){startKick(p,best.pos.x+best.vel.x*0.4,best.pos.z+best.vel.z*0.4,7.5+d2(p.pos,best.pos)*0.45,0.35);}
      }
    }
    moveTo(p,tx,tz,dt,p.speed*(d<1.6?0.95:1),false);
  }else{
    if(p.pro&&game.lastTeam!==tm){/* a pro marks Disque tightly when the other team has the ball */var dq=players[0];moveTo(p,clamp(dq.pos.x-dir*1.4,-HX+1,HX-1),clamp(dq.pos.z,-HZ+1,HZ-1),dt,p.speed,false);return;}
    var has=game.lastTeam===tm;
    if(has){
      tx=clamp(bp.x+dir*5.5,-HX+3,HX-3);
      var other=mates.filter(function(m){return m!==p;})[0];
      tz=clamp(-bp.z*0.6+(other&&other.pos.z>0?-3:3),-HZ+2,HZ-2);
    }else{
      var ogx=-dir*HX;
      tx=clamp(lerp(ogx,bp.x,0.5),-HX+4,HX-4);if(Math.abs(tx-ogx)<5.5)tx=ogx+dir*5.5;
      tz=clamp(bp.z*0.5,-HZ+2,HZ-2);
    }
    moveTo(p,tx,tz,dt,p.speed*0.85,true);
  }
}
function aiGK(p,dt){
  var tm=p.team,gdir=tm===0?-1:1,goalX=gdir*HX,lineX=gdir*(HX-1.4),b=ball;
  if(p.diveCool>0)p.diveCool-=dt;
  if(p.dive){
    var dv=p.dive;dv.t+=dt;
    if(dv.t>dv.wait){
      var dz=dv.z-p.pos.z;p.vel.z=clamp(dz*7,-8.5,8.5);p.vel.x*=0.9;
    }else{p.vel.z*=0.9;}
    p.diveT=clamp((dv.t-dv.wait*0.5)/0.5,0,1)*(dv.t<1.1?1:1-smooth((dv.t-1.1)/0.3));
    if(dv.t>1.45){p.dive=null;p.diveCool=0.9;p.diveT=0;}
    return;
  }
  p.diveT=Math.max(0,p.diveT-dt*4);
  if(b.v.x*gdir>6&&(goalX-b.p.x)*gdir>0&&Math.abs(goalX-b.p.x)<11&&p.diveCool<=0&&game.state==='play'){
    var t=(goalX-b.p.x)/b.v.x,pz=b.p.z+b.v.z*t,py=b.p.y+b.v.y*t-0.5*GRAV*t*t;
    if(Math.abs(pz)<GW+0.5&&py<GH+0.4){
      var side=d2(p.pos,{x:p.pos.x,z:pz});
      p.dive={t:0,wait:p.react,z:clamp(pz+gauss()*p.sigma,-GW-0.4,GW+0.4),y:clamp(py,0.25,GH)};
      p.diveSide=Math.sign(p.dive.z-p.pos.z)||1;
      return;
    }
  }
  var bd=d2(p.pos,b.p),bs=Math.sqrt(b.v.x*b.v.x+b.v.z*b.v.z);
  var tx=lineX,tz=clamp(b.p.z*0.4,-GW+0.8,GW-0.8);
  var sally=Math.abs(b.p.x-goalX)<4.2&&bs<3.5&&Math.abs(b.p.z)<GW+1.5&&game.state==='play';
  if(sally){tx=b.p.x;tz=b.p.z;}
  moveTo(p,tx,tz,dt,p.speed*(sally?1.1:0.95),!sally);
  if(bd<1.7&&bs<7&&p.cool<=0&&!p.kick&&game.state==='play'){
    startKick(p,-gdir*5,(rndS()<0.5?-1:1)*(3+rndS()*4),11,0.7);
  }
}

/* ---------- simulation tick ---------- */
function tick(dt){
  game.t+=dt;
  var playing=game.state==='play';
  if(game.state==='kickoff'){
    game.timer-=dt;
    players.forEach(function(p){var kp=kickoffPos(p);moveTo(p,kp[0],kp[1],dt,p.speed,true);});
    if(game.timer<=0){game.state='play';}
  }
  if(game.state==='intro'){
    players.forEach(function(p){var kp=kickoffPos(p);moveTo(p,kp[0],kp[1],dt,p.speed,true);});
  }
  if(game.state==='full'){
    players.forEach(function(p){moveTo(p,p.pos.x,p.pos.z,dt,0,false);});
  }
  if(game.state==='play'){
    game.clock+=dt;
    if(game.clock>=game.limit){game.state='full';game.scoredTeam=game.score[0]>game.score[1]?0:(game.score[1]>game.score[0]?1:-1);game.scorer=players[0];}
    pickChasers();
    players.forEach(function(p){if(p.role==='gk')aiGK(p,dt);else aiField(p,dt);});
  }
  if(game.state==='goal'){
    game.timer-=dt;
    players.forEach(function(p){moveTo(p,p.pos.x,p.pos.z,dt,0,false);});
    if(game.timer<=0){resetKickoff();}
  }
  /* kick sequencing */
  players.forEach(function(p){
    if(p.cool>0)p.cool-=dt;
    if(p.tapT>0)p.tapT-=dt;
    if(p.kick){
      p.kickT+=dt;
      p.vel.x*=0.9;p.vel.z*=0.9;
      var want=Math.atan2(p.kick.tx-p.pos.x,p.kick.tz-p.pos.z);
      p.yaw+=wrapA(want-p.yaw)*Math.min(1,dt*14);
      if(p.kickT>=0.2&&!p.kick.done){
        p.kick.done=true;
        if(d2(p.pos,ball.p)<1.55&&ball.p.y<1.2&&game.state==='play'){applyKick(p);}
      }
      if(p.kickT>=0.6){p.kick=null;p.kickT=-1;}
    }
  });
  /* movement */
  players.forEach(function(p){
    p.pos.x+=p.vel.x*dt;p.pos.z+=p.vel.z*dt;
    var lim=p.role==='gk'?HX-0.8:HX-0.8;
    p.pos.x=clamp(p.pos.x,-lim,lim);p.pos.z=clamp(p.pos.z,-HZ+0.7,HZ-0.7);
    if(p.role==='gk'){p.pos.x=clamp(p.pos.x,-HX+0.8,HX-0.8);}
    var spd=Math.sqrt(p.vel.x*p.vel.x+p.vel.z*p.vel.z);
    if(!p.kick){
      var want;
      if(p.role==='gk'&&!p.dive){
        var base=p.team===0?Math.PI/2:-Math.PI/2;
        var toB=Math.atan2(ball.p.x-p.pos.x,ball.p.z-p.pos.z);
        want=base+clamp(wrapA(toB-base),-1.1,1.1);
      }else if(spd>1.0){want=Math.atan2(p.vel.x,p.vel.z);}
      else{want=Math.atan2(ball.p.x-p.pos.x,ball.p.z-p.pos.z);}
      var diff=wrapA(want-p.yaw),st=clamp(diff,-11*dt,11*dt);
      p.yaw+=st;p.yawRate=lerp(p.yawRate,st/dt,0.2);
    }
  });
  /* separation */
  for(var i=0;i<players.length;i++){for(var j=i+1;j<players.length;j++){
    var a=players[i],c=players[j],dx=c.pos.x-a.pos.x,dz=c.pos.z-a.pos.z,dd=Math.sqrt(dx*dx+dz*dz),mn=a.rad+c.rad;
    if(dd<mn&&dd>1e-4){
      var ov=(mn-dd)/2,nx=dx/dd,nz=dz/dd;
      a.pos.x-=nx*ov;a.pos.z-=nz*ov;c.pos.x+=nx*ov;c.pos.z+=nz*ov;
      var rv=(c.vel.x-a.vel.x)*nx+(c.vel.z-a.vel.z)*nz;
      if(rv<0){a.vel.x+=nx*rv*0.5;a.vel.z+=nz*rv*0.5;c.vel.x-=nx*rv*0.5;c.vel.z-=nz*rv*0.5;}
    }
  }}
  /* ball vs players */
  if(game.state!=='kickoff'){
    for(var s=0;s<2;s++){stepBall(dt/2);}
    players.forEach(function(p){
      var bp=ball.p;
      if(p.dive&&p.dive.t>p.dive.wait){
        var yc=lerp(0.9,p.dive.y,smooth((p.dive.t-p.dive.wait)/0.3));
        var dx=bp.x-p.pos.x,dy=bp.y-yc,dz=bp.z-p.pos.z,dd=Math.sqrt(dx*dx+dy*dy+dz*dz),R=p.reach+BR;
        if(dd<R&&dd>1e-4){
          var nx=dx/dd,ny=dy/dd,nz=dz/dd;
          var sp=Math.sqrt(ball.v.x*ball.v.x+ball.v.y*ball.v.y+ball.v.z*ball.v.z);
          var out=Math.max(5,sp*0.45);
          ball.v.x=nx*out+(p.team===0?1:-1)*3;ball.v.y=Math.max(ny*out,1.5);ball.v.z=nz*out;
          bp.set(p.pos.x+nx*R,Math.max(BR,yc+ny*R),p.pos.z+nz*R);
          game.lastTouch=p;game.lastTeam=p.team;p.tapT=0.25;
        }
      }else if(bp.y<1.5){
        var dx2=bp.x-p.pos.x,dz2=bp.z-p.pos.z,d=Math.sqrt(dx2*dx2+dz2*dz2),mn=p.rad+BR;
        if(d<mn&&d>1e-4){
          var nx2=dx2/d,nz2=dz2/d;
          bp.x=p.pos.x+nx2*mn;bp.z=p.pos.z+nz2*mn;
          var vn=ball.v.x*nx2+ball.v.z*nz2,pn=p.vel.x*nx2+p.vel.z*nz2;
          var vnew=pn*1.12+0.45+Math.max(0,pn-vn)*0.3;
          if(vn<vnew){ball.v.x+=nx2*(vnew-vn);ball.v.z+=nz2*(vnew-vn);}
          if(p.role==='gk'&&Math.abs(ball.p.x)>HX-3.5&&Math.abs(vn-pn)>5){ball.v.y=Math.max(ball.v.y,2.5);}
          if(Math.abs(vn-pn)>1.2&&p.tapT<=0)p.tapT=0.25;
          game.lastTouch=p;game.lastTeam=p.team;
        }
      }
    });
    /* goal check */
    if(game.state==='play'&&Math.abs(ball.p.x)>HX&&Math.abs(ball.p.z)<GW&&ball.p.y<GH){
      var sc=ball.p.x>0?0:1;
      game.score[sc]++;game.state='goal';game.timer=3.6;game.scoredTeam=sc;game.kickTeam=1-sc;
      var cand=game.lastTouch&&game.lastTouch.team===sc&&game.lastTouch.role==='field'?game.lastTouch:teamField(sc)[0];
      game.scorer=cand;game.goalFlash=1;game.shake=0.5;
      sAEl.textContent=game.score[0];sBEl.textContent=game.score[1];
      goalBy.textContent=cand.name;
      goalEl.classList.remove('show');void goalEl.offsetWidth;goalEl.classList.add('show');
    }
    /* dead-ball watchdog: if nothing moves the ball for 2s, pop it toward the middle */
    var bs2=Math.sqrt(ball.v.x*ball.v.x+ball.v.z*ball.v.z);
    if(game.state==='play'){
      if(bs2<0.8){game.dead=(game.dead||0)+dt;}else game.dead=0;
      if(game.dead>2){game.dead=0;ball.v.x=-Math.sign(ball.p.x)*4.5;ball.v.z=-Math.sign(ball.p.z)*3;ball.v.y=3;}
    }
    /* corner scrum: ball kept in a corner for 4s gets cleared to the middle */
    if(game.state==='play'){
      if(Math.abs(ball.p.x)>HX-2.5&&Math.abs(ball.p.z)>HZ-2.5){game.corner=(game.corner||0)+dt;}else game.corner=0;
      if(game.corner>4){game.corner=0;ball.v.x=-Math.sign(ball.p.x)*8;ball.v.z=-Math.sign(ball.p.z)*6;ball.v.y=5;}
    }
    /* stuck ball nudge */
    var bsp=Math.sqrt(ball.v.x*ball.v.x+ball.v.z*ball.v.z);
    if(bsp<0.3&&(Math.abs(ball.p.x)>HX-0.9||Math.abs(ball.p.z)>HZ-0.9)&&game.state==='play'){
      ball.v.x+=-Math.sign(ball.p.x)*0.5*dt*20;ball.v.z+=-Math.sign(ball.p.z)*0.5*dt*20;
    }
  }
  players.forEach(function(p){animate(p,dt);});
}

/* ---------- animation ---------- */
function alive(R,o,dt){
  if(o.bt===undefined){o.bt=1+Math.random()*3;o.br=Math.random()*6;}
  o.bt-=dt;var b=o.bt<0.13?0.1:1;if(o.bt<0)o.bt=1.6+Math.random()*3.5;
  R.pupils.forEach(function(pg){pg.scale.y=b;});
  o.br+=dt*2.4;var s=1+Math.sin(o.br)*0.016;
  var sy=1+clamp((o.vy||0)*0.035,-0.14,0.16),sx=1/Math.sqrt(sy);
  R.root.scale.set(R.scale*sx*s,R.scale*sy,R.scale*sx*s);
}
var AwV=new V3();
function kickPose(p){
  if(p.kickT>=0){
    var t=p.kickT,o={th:0,kn:0,lean:0};
    if(t<0.2){var f=t/0.2;o.th=lerp(0,0.9,f);o.kn=lerp(0,1.3,f);o.lean=-0.15*f;}
    else if(t<0.32){var f2=(t-0.2)/0.12;o.th=lerp(0.9,-1.4,f2);o.kn=lerp(1.3,0.15,f2);o.lean=lerp(-0.15,0.25,f2);}
    else{var f3=smooth((t-0.32)/0.28);o.th=lerp(-1.4,0,f3);o.kn=lerp(0.15,0,f3);o.lean=lerp(0.25,0,f3);}
    return o;
  }
  if(p.tapT>0){var f4=p.tapT/0.25,sn=Math.sin(f4*Math.PI);return {th:-0.8*sn,kn:0.5*sn,lean:0.05*sn};}
  return null;
}
function animate(p,dt){
  var R=p.rig,spd=Math.sqrt(p.vel.x*p.vel.x+p.vel.z*p.vel.z);
  var sn=clamp01(spd/p.speed);
  var vf=p.vel.x*Math.sin(p.yaw)+p.vel.z*Math.cos(p.yaw),vl=p.vel.x*Math.cos(p.yaw)-p.vel.z*Math.sin(p.yaw);
  var ps={sn:sn,vf:vf,vl:vl,fwdn:spd>0.1?Math.abs(vf)/spd:1,latn:spd>0.1?Math.abs(vl)/spd:0};
  p.phase+=spd*dt*2.3;
  /* acceleration for the springs */
  var ax=(p.vel.x-p.prevVel.x)/dt,az=(p.vel.z-p.prevVel.z)/dt;
  p.prevVel.copy(p.vel);
  p.accS.x=lerp(p.accS.x,clamp(ax,-30,30),1-Math.exp(-dt*14));p.accS.z=lerp(p.accS.z,clamp(az,-30,30),1-Math.exp(-dt*14));
  var aF=p.accS.x*Math.sin(p.yaw)+p.accS.z*Math.cos(p.yaw);
  ps.lean=clamp(aF*0.012+vf*0.03,-0.3,0.5);
  ps.roll=clamp(-p.yawRate*0.03,-0.25,0.25);
  /* mood */
  var over=game.state==='goal'||game.state==='full';
  var celeT=over&&game.scoredTeam===p.team?1:0;
  var sulkT=over&&game.scoredTeam>=0&&game.scoredTeam!==p.team?1:0;
  p.cele=lerp(p.cele,celeT,1-Math.exp(-dt*8));p.sulk=lerp(p.sulk,sulkT,1-Math.exp(-dt*5));
  if(celeT){p.celeT+=dt;}else p.celeT=0;
  var hy=p.cele>0.5?Math.abs(Math.sin(p.celeT*8+p.id))*0.5*p.cele:0;
  var vyNew=(hy-p.hy)/dt;p.ay=clamp((vyNew-p.vy)/dt,-40,40)*0.15;p.vy=vyNew;p.hy=hy;
  /* dive amount (keepers) */
  p.diveAmt=p.role==='gk'?p.diveT:0;
  var diveLift=p.diveAmt>0?Math.sin(p.diveAmt*Math.PI*0.5)*(R.kind==='octo'?0.55:0.4):0;
  p.obj.position.set(p.pos.x,hy+diveLift,p.pos.z);
  p.obj.rotation.y=p.yaw;
  if(R.kind==='biped')animBiped(R,p,ps,dt);
  else if(R.kind==='quad')animQuad(R,p,ps,dt);
  else animOcto(R,p,ps,dt);

  var a=wrapA(Math.atan2(ball.p.x-p.pos.x,ball.p.z-p.pos.z)-p.yaw),ty=clamp(a,-0.9,0.9);
  R.head.rotation.y+=(ty-R.head.rotation.y)*Math.min(1,dt*10);
  R.head.rotation.x=lerp(R.head.rotation.x,0.05+p.sulk*0.55,Math.min(1,dt*8));
  R.pupils.forEach(function(pg){pg.position.x=pg.userData.bx+clamp(a-ty,-0.6,0.6)*0.05;});
  /* springs */
  AwV.set(p.accS.x,p.ay,p.accS.z);
  R.chains.forEach(function(c){chainUpdate(c,dt,AwV);});
}
function animBiped(R,p,ps,dt){
  var c=R.cfg,s=ps.sn,ph=p.phase,kp=kickPose(p);
  for(var i=0;i<2;i++){
    var L=R.legs[i],sp=c.hop?ph:ph+(i?Math.PI:0);
    var th=-Math.sin(sp)*c.th*s*(0.4+0.6*ps.fwdn),kn=Math.max(0,Math.cos(sp))*c.kn*s;
    if(i===0&&kp){th=kp.th;kn=kp.kn;}
    var dv=p.diveAmt;
    L.hip.rotation.x=th;L.knee.rotation.x=kn;L.ank.rotation.x=-(th+kn)*0.8;
    L.hip.rotation.z=(i?1:-1)*(Math.abs(Math.sin(sp))*0.5*ps.latn*s);
  }
  var bob=Math.abs(Math.sin(c.hop?ph:ph))*c.bob*s;
  R.pel.position.y=c.hipY+bob;
  R.spine.rotation.x=ps.lean*c.lean+(kp?kp.lean:0)+p.sulk*0.25;
  R.pel.rotation.z=ps.roll;
  R.spine.rotation.y=c.hop?0:Math.sin(ph)*0.24*s+(kp?-kp.th*0.22:0);
  R.pel.rotation.y=c.hop?0:-Math.sin(ph)*0.1*s;
  if(R.arms){
    for(var j=0;j<2;j++){
      var A=R.arms[j],sw=(c.hop?-Math.sin(ph)*0.3:Math.sin(ph+(j?0:Math.PI))*c.arm)*s;
      A.sh.rotation.x=lerp(sw,-0.4,p.cele);
      A.sh.rotation.z=A.side*lerp(0.12+0.15*s,2.7,p.cele);
      A.el.rotation.x=lerp(-(0.3+0.55*s),-0.2,p.cele);
    }
  }
  if(R.wings){
    var fl=p.cele>0.4?Math.sin(p.celeT*22)*0.6:Math.sin(ph*2)*0.45*s;
    R.wings.forEach(function(w){
      w.exZ=w.side*(0.25+0.7*s*0.8+fl+(kp?0.5:0)+p.cele*0.8);
    });
  }
  if(R.chains[0]&&!R.wings){R.chains[0].exZ=Math.sin(p.celeT*8+ph*0.2)*0.4*(0.3+p.cele+s*0.3);}
}
function animQuad(R,p,ps,dt){
  var c=R.cfg,s=ps.sn,ph=p.phase,kp=kickPose(p),dv=p.diveAmt;
  for(var i=0;i<4;i++){
    var L=R.legs[i],sp=ph+((i===0||i===3)?0:Math.PI);
    var th=-Math.sin(sp)*c.th*s*(0.4+0.6*ps.fwdn),kn=Math.max(0,Math.cos(sp))*c.kn*s;
    if(i===0&&kp){th=kp.th*0.9;kn=kp.kn*0.8;}
    L.hip.rotation.x=th;L.knee.rotation.x=kn;L.ank.rotation.x=-(th+kn)*0.8;
    var sd=(i%2?1:-1);
    L.hip.rotation.z=sd*(Math.abs(Math.sin(sp))*0.5*ps.latn*s+dv*0.6);
  }
  if(R.kind==='quad'&&R.trunk){
    var tr=R.trunk;
    tr.exX=-(p.diveAmt*2.4)-(kp?0.8:0)-p.cele*1.6;
    tr.exZ=Math.sin(p.phase*0.5+p.id)*0.3*s+p.diveSide*p.diveAmt*0.8;
  }
  var bob=Math.abs(Math.sin(ph))*c.bob*s;
  R.pel.position.y=c.hipY+bob;
  R.spine.rotation.x=ps.lean*c.lean+(kp?kp.lean*0.5:0)-p.cele*0.35+p.sulk*0.18;
  R.pel.rotation.z=ps.roll-p.diveSide*p.diveAmt*0.95;

function animOcto(R,p,ps,dt){
  var s=ps.sn,ph=p.phase,kp=kickPose(p),dv=p.diveAmt;
  R.pel.position.y=0.5+Math.abs(Math.sin(ph*0.8))*0.12*s;
  R.spine.rotation.x=ps.lean*0.7+p.sulk*0.2+(kp?kp.lean:0);
  R.pel.rotation.z=ps.roll-p.diveSide*dv*0.9;
  R.tent.forEach(function(c,i){
    var th=0.9+Math.sin(ph*1.2+i*0.8)*0.3*s+Math.sin(p.celeT*7+i)*0.1*p.cele;
    th=lerp(th,2.3+Math.sin(p.celeT*9+i*0.7)*0.35*p.cele,Math.max(dv,p.cele*0.9));

    _d.set(Math.cos(a)*Math.sin(th),-Math.cos(th),Math.sin(a)*Math.sin(th));
    c.pivot.quaternion.setFromUnitVectors(new V3(0,-1,0),_d);

  });
}

/* ---------- camera + loop ---------- */
var yaw=0,dragging=false,lx=0,camPos=new V3(0,9,14),camLook=new V3(),needSnap=true;
function updateCam(dt){
  var aspect=camera.aspect,zoom=aspect<1?1.05:1,look=new V3(),off=new V3();
  if((game.state==='goal'||game.state==='full'||game.state==='intro')&&game.scorer){
    var sp=game.scorer.pos,a=game.state==='goal'?0.6+(3.6-game.timer)*0.3:(game.state==='intro'?1.25+Math.sin(game.t*0.4)*0.5:game.t*0.3);
    var cd=game.state==='intro'?4.6:6.2;
    look.set(sp.x,1.0,sp.z);off.set(Math.sin(a)*cd,2.4,Math.cos(a)*cd);
  }else{
    var lim=aspect<1?12.5:9,bx=clamp(ball.p.x*(aspect<1?0.95:0.85),-lim,lim);
    look.set(bx,0.4,ball.p.z*(aspect<1?0.55:0.3));
    if(game.manual){look.x=lerp(look.x,clamp(players[0].pos.x,-lim,lim),0.35);look.z=lerp(look.z,players[0].pos.z,0.35)+(aspect<1?2.6:1.2);}off.set(0,aspect<1?8.5:10.5,aspect<1?12.5:15.5);
  }
  off.multiplyScalar(zoom).applyAxisAngle(new V3(0,1,0),yaw);
  var dpos=look.clone().add(off),k=needSnap?1:1-Math.exp(-dt*2.2);
  camPos.lerp(dpos,k);camLook.lerp(look,k);
  camera.position.copy(camPos);
  if(game.shake>0){game.shake=Math.max(0,game.shake-dt);camera.position.x+=Math.sin(game.t*70)*game.shake*0.25;camera.position.y+=Math.cos(game.t*83)*game.shake*0.18;}
  camera.lookAt(camLook);needSnap=false;
}
function renderFrame(dt){
  /* ball visuals */
  var mv=new V3().copy(ball.p).sub(ball.prev),dl=mv.length();
  if(dl>1e-5&&dl<4){
    var ax=new V3().crossVectors(new V3(0,1,0),mv).normalize();
    if(ax.lengthSq()>0.5)ballMesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(ax,dl/BR));
  }
  ballMesh.position.copy(ball.p);ball.prev.copy(ball.p);
  var bsp=ball.v.length();hist.unshift(ball.p.clone());if(hist.length>16)hist.pop();
  trail.forEach(function(tm,i){var h=hist[(i+1)*2];if(h){tm.position.copy(h);tm.material.opacity=bsp>9?0.3*(1-i/7):0;}});
  puffs.forEach(function(q){if(q.life>0){q.life-=dt;var f=1-q.life/0.55;q.m.scale.setScalar(0.1+f*0.32);q.m.position.y+=dt*0.5;q.m.material.opacity=0.5*(1-f);if(q.life<=0)q.m.visible=false;}});
  /* nets ripple */
  backNets.forEach(function(n){n.m.position.x=GD+ (game.goalFlash>0&&((game.scoredTeam===0&&n.g.position.x>0)||(game.scoredTeam===1&&n.g.position.x<0))?Math.max(0,Math.sin(game.goalFlash*10)*game.goalFlash*0.5):0);});
  game.goalFlash=Math.max(0,game.goalFlash-dt*1.2);

  var cel=(game.state==='goal'||game.state==='full')?1:0;game.crowdC=lerp(game.crowdC||0,cel,1-Math.exp(-dt*4));
  var amp=0.05+0.45*game.crowdC,tt=game.t*(3+game.crowdC*5);
  for(var i=0;i<cBase.length;i++){
    var b=cBase[i];dummy.position.set(b.x,b.y+Math.abs(Math.sin(tt+b.ph))*amp,b.z);dummy.updateMatrix();crowd.setMatrixAt(i,dummy.matrix);
  }
  crowd.instanceMatrix.needsUpdate=true;
  sun.target.position.set(ball.p.x*0.8,0,0);sun.position.set(ball.p.x*0.8-8,18,10);
  var ct=game.manual?Math.max(0,game.limit-game.clock):game.clock;
  var m=Math.floor(ct/60),sec=Math.floor(ct%60);
  clockEl.textContent=m+':'+(sec<10?'0':'')+sec;
  updateCam(dt);
  renderer.render(scene,camera);
}

var chipsEl=$('chips');
chapters.forEach(function(c,i){
  var b=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+c.name;
  b.addEventListener('click',function(){go(i);});chipsEl.appendChild(b);
});
var toggle=$('toggle'),speedB=$('speed'),replay=$('replay');
function label(){toggle.textContent=playing?'Pause':'Play';speedB.textContent='Speed '+speedMul+'x';speedB.style.display=story.idx===0?'':'none';}
function go(i){
  var prev=chapters[story.idx];if(prev&&prev.leave)prev.leave();
  story.idx=i;story.tok++;
  say(null);goalEl.classList.remove('show');
  var c=chapters[i];
  var isM=(i===0||i===6);
  hud.style.display=isM?'flex':'none';
  pill.style.display=isM?'none':'block';pill.textContent=c.pill;
  Array.prototype.forEach.call(chipsEl.children,function(b,j){b.className=j===i?'on':'';});
  camSnap=true;playing=true;last=performance.now();kickB.textContent='KICK';kickB.style.fontSize='';kickB.className='pad kick';
  c.enter();label();
}
toggle.addEventListener('click',function(){playing=!playing;last=performance.now();label();});
speedB.addEventListener('click',function(){speedMul=speedMul===1?2:1;label();});
replay.addEventListener('click',function(){go(0);});

function frame(dt){
  var c=chapters[story.idx];
  c.update(playing?dt:0);
  if(story.idx!==0&&story.idx!==6){renderer.render(c.scene,camera);if(c.pip)c.pip(renderer);}
}
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  frame(dt);
  requestAnimationFrame(loop);
}
window.__story={go:go,adv:function(t,quiet){var n=Math.round(t/STEP);noRender=true;for(var i=0;i<n;i++)chapters[story.idx].update(STEP);noRender=false;if(!quiet)frame(STEP);},
  state:function(){return {idx:story.idx,game:game.state,score:game.score.slice(),road:{phase:chRoad.st.phase,prog:chRoad.st.prog,lives:chRoad.st.lives},night:{m:chNight.st.m,hp:chNight.st.hp,hearts:chNight.st.hearts,hits:chNight.st.hits,ball:chNight.st.ball},sw:{mode:chSwim.sw.mode,x:chSwim.P.x,res:chSwim.sw.res.slice(),pIn:chSwim.sw.pIn,rIn:chSwim.sw.rIn,rTries:chSwim.sw.rTries,used:chSwim.sw.used},cap:capText.textContent,try:story.attempt};},
  swim:chSwim,night:chNight,road:chRoad,build:chBuild,giant:chGiant,army:chArmy,puppets:chPuppets,final:chFinal,rebuild:chRebuild,shadow:chShadow,fight:chFight,pause:function(){},game:game,players:players,ball:ball,pad:pad,sim:function(seed,secs){newMatch(seed);game.manual=false;game.limit=1e9;var n=Math.round(secs/STEP);for(var i=0;i<n;i++)tick(STEP);game.limit=MATCH_LEN;return game.score.slice();}};
go(0);
frame(0.016);
requestAnimationFrame(function(n){last=n;loop(n);});
})();
</script>
</body>
</html>
