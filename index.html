<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI HLPR Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1224;color:#f3efe6;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:560px;width:100%}
p.k{letter-spacing:.2em;font-size:13px;font-weight:700;color:#ffd23f;margin:0 0 8px}
h1{font-size:clamp(34px,9vw,56px);line-height:1.05;margin:0 0 12px}
p{font-size:18px;line-height:1.5;color:#c9d2ea;margin:0 0 24px}
a.game{display:block;background:#141d38;border-left:8px solid #2f63ee;border-radius:16px;padding:20px 22px;color:inherit;text-decoration:none}
a.game:hover,a.game:focus-visible{background:#1c2850;outline:3px solid #ffd23f;outline-offset:2px}
a.game b{display:block;font-size:24px;margin-bottom:6px}
a.game span{color:#9aa6c4;font-size:16px}
a.game i{display:inline-block;margin-top:14px;background:#ffd23f;color:#1a1300;font-style:normal;font-weight:700;border-radius:999px;padding:10px 20px}
</style>
</head>
<body>
<main>
  <p class="k">AI HLPR KIDS</p>
  <h1>Games made by kids, for kids</h1>
  <p>Our first game is here. More are on the way.</p>
  <a class="game" href="raccoon-disque/">
    <b>Raccoon Disque: Story Mode</b>
    <span>Football, school, swimming and a shadow monster. Play it on a phone or a computer.</span><br>
    <i>Play</i>
  </a>
</main>
</body>
</html>
